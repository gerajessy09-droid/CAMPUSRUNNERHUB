<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusRunner: Get it done on campus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6E4F'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23F6B93B' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0B6E4F;--gd:#084c37;--a:#B7791F;--s9:#0f172a;--s6:#475569;--s2:#e2e8f0;--s1:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--s9);background:linear-gradient(160deg,#ecfdf5,#fffbeb 60%,#f8fafc);min-height:100vh}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.w{max-width:448px;margin:0 auto;padding:0 16px}
a{color:var(--g)}button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--s2)}
header .w{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px;color:var(--g);text-decoration:none}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--g);display:grid;place-items:center}
.banner{background:#fef3c7;color:#78350f;font-size:13px;padding:6px 16px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#10906a,var(--g));color:#fff;box-shadow:0 6px 16px rgba(11,110,79,.28)}
.btn.o{background:#fff;color:var(--g);box-shadow:none;border:1.5px solid var(--g)}.btn.r{background:#b91c1c;box-shadow:none}.btn.s{min-height:44px;padding:0 12px;font-size:14px}.btn.b{width:100%}
.card{background:#fff;border:1px solid var(--s2);border-radius:16px;padding:16px;margin:12px 0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 12px;margin:4px 0 10px;background:#fff}
label{font-size:14px;font-weight:600}.err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.ok{background:#dcfce7;color:#14532d;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}
.hero{background:linear-gradient(145deg,var(--gd),var(--g) 60%,#16a34a);color:#fff;padding:44px 0 56px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#f6b93b88,transparent 70%)}
.hero h1{font-size:38px;line-height:1.05}.hero p{opacity:.92;font-size:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:64px;border:2px solid var(--s2);border-radius:14px;background:#fff;font-weight:700;cursor:pointer}.tile.on{border-color:var(--g);background:#ecfdf5;color:var(--g)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}.chip{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:13px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s1)}
.b-Pending{background:#fef3c7;color:#92400e}.b-Accepted{background:#dbeafe;color:#1e40af}.b-Completed{background:#dcfce7;color:#166534}.b-Disputed{background:#fee2e2;color:#991b1b}.b-Cancelled{background:var(--s1);color:var(--s6)}
.code{font-family:'Bricolage Grotesque',monospace;font-size:44px;letter-spacing:.2em;text-align:center;background:#fffbeb;border:2px dashed var(--a);border-radius:14px;padding:8px;margin:8px 0;color:var(--a)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mut{color:var(--s6);font-size:14px}.big{font-size:32px;font-weight:800}
.bal{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:0}
.empty{text-align:center;color:var(--s6);padding:24px 8px}.empty b{display:block;font-size:30px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:1px solid var(--s2);z-index:5}
nav.tabs .w{display:flex}nav.tabs a{flex:1;text-align:center;padding:8px 0;min-height:56px;text-decoration:none;color:var(--s6);font-size:12px;font-weight:600}nav.tabs a.on{color:var(--g)}
nav.tabs svg{display:block;margin:0 auto 2px}main{padding-bottom:90px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:grid;place-items:center;z-index:10;padding:16px}.ov .card{max-width:380px;width:100%}
.sp{display:grid;grid-template-columns:1fr;gap:10px}.step{display:flex;gap:12px;align-items:flex-start}.step b{background:var(--g);color:#fff;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="root"></div>
<script>
const K='cr_proto_v1',FEE=1250,LOCS=['Library','Student centre','Ubangi House','Law faculty','Nile House','Boys Hostels','Girls Hostels','Cafeteria'];
const SVC={Food:'Food',Delivery:'Packages',Assignment:'Assignment',Project:'Project'},WHEN=['ASAP','Within 30 min','Within 1 hour','Today'];
let S={type:'Food',when:'ASAP',f:{},show:false,filter:'All',q:'',msg:'',err:''};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const EMPTY=()=>({me:null,meId:null,users:[],tasks:[],tx:[],log:[],stats:{esc:0},demo:false});
let db=EMPTY(),TOK=localStorage.getItem('cr_token')||'';
const me=()=>db.users.find(u=>u.id===db.meId),usr=id=>db.users.find(u=>u.id===id)||{name:'Student',phone:''};
const bn=()=>db.demo?'<div class="banner">Demo mode: payments are simulated. No real money moves.</div>':'';
async function api(p,m,b){try{const r=await fetch('/api'+p,{method:m||'GET',headers:Object.assign({'Content-Type':'application/json'},TOK?{Authorization:'Bearer '+TOK}:{}),body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok&&!j.error)j.error='Something went wrong. Try again.';j._s=r.status;return j}catch(x){return {error:'Could not reach the server. Check your internet connection.',_s:0}}}
async function load(){if(!TOK){const c=await api('/config');db=Object.assign(EMPTY(),{demo:!!c.demo});return}const r=await api('/state');if(r._s===401||r.suspended){TOK='';localStorage.removeItem('cr_token');if(r.suspended)S.sus=r.error;db=EMPTY();return}if(r.error){S.err=r.error;return}db=r}
async function act(p,m,b,ok){const r=await api(p,m,b);S.err=r.error||'';S.msg=!r.error&&ok?ok:'';await load();go();return r}
async function inn(){const r=await api('/auth/login','POST',{email:v('em').trim(),password:v('pw')});if(r.error){S.err=r.error;return go()}TOK=r.token;localStorage.setItem('cr_token',TOK);S.sus='';S.err='';await load();const u=me();location.hash=u&&u.role==='Admin'?'#/admin':'#/post';go()}
async function reg(){const r=await api('/auth/register','POST',{name:v('n'),email:v('em'),password:v('pw'),sid:v('sid'),phone:v('ph'),consent:document.getElementById('cs').checked});if(r.error){S.err=r.error;return go()}TOK=r.token;localStorage.setItem('cr_token',TOK);S.err='';await load();location.hash='#/post';go()}
function out(){TOK='';localStorage.removeItem('cr_token');db=EMPTY();location.hash='#/';go()}
function resub(){act('/auth/resubmit-id','POST')}
async function mk(){save2();const {p,i}=priceOf(),g=S.type==='Food'||S.type==='Delivery';
const bad=!v('ti').trim()?'Add a title.':!v('dr').trim()?'Add a drop-off place.':g&&!v('pk').trim()?'Add a pickup place.':g&&(i<0||i>50000)?'Items cost must be between ₦0 and ₦50,000.':!g&&p<500?'Set a price of at least ₦500.':'';
if(bad){S.err=bad;return go()}const r=await api('/tasks','POST',{type:S.type,title:v('ti'),desc:v('de'),pickup:g?v('pk'):'',drop:v('dr'),when:S.when,price:p,items:i});if(r.error){S.err=r.error;return go()}S.err='';S.f={};S.show=false;await load();startPay(r.id)}
async function startPay(id){const r=await api('/payments/initialize','POST',{taskId:id});if(r.error){S.err=r.error+' Your task is saved. Press Pay to try again.';await load();return go()}if(r.demo){S.pay=id;await load();go()}else location.href=r.url}
function payOv(){const t=db.tasks.find(x=>x.id===S.pay);return t?`<div class="ov"><div class="card"><h3>Demo checkout</h3><p>No real money moves. This stands in for Paystack.</p><button class="btn b" onclick="demoPay(${t.id})">Pay ${N(total(t))} with Paystack</button><br><br><button class="btn o b" onclick="S.pay=0;go()">Pay later</button></div></div>`:''}
function demoPay(id){S.pay=0;act('/payments/demo-confirm','POST',{taskId:id},'Payment received. Your task is waiting for a runner.')}
function cancel(id){act('/tasks/'+id,'DELETE')}
function done(id){act('/tasks/'+id+'/complete','POST',null,'Payment released to the runner.')}
function report(id){const r=prompt('What went wrong? Write a short reason.');if(!r||!r.trim())return;act('/tasks/'+id+'/dispute','POST',{reason:r.trim()})}
function acc(id){act('/tasks/'+id+'/accept','POST')}
function code(id){act('/tasks/'+id+'/confirm-handover','POST',{code:v('cd'+id)})}
function dlv(id){act('/tasks/'+id+'/delivered','POST')}
function bank(){const sel=document.getElementById('bk');act('/wallet/bank','POST',{bankCode:sel.value,bankName:sel.options[sel.selectedIndex].text,accountNo:v('an')})}
function wd(){act('/wallet/withdraw','POST',{amount:+v('wa')},'Withdrawal requested.')}
function ver(id,ok){if(ok)return act('/admin/verify/'+id,'POST');const r=prompt('Why is the ID rejected?');if(!r||!r.trim())return;act('/admin/reject/'+id,'POST',{reason:r.trim()})}
function res(id,pay){act('/admin/disputes/'+id+'/resolve','POST',{pay:!!pay})}
function fc(id){const r=prompt('Reason for cancelling this task?');if(!r||!r.trim())return;act('/admin/tasks/'+id+'/force-cancel','POST',{reason:r.trim()})}
function sus(id){const r=prompt('Reason for suspending this student? They will see it.');if(!r||!r.trim())return;act('/admin/users/'+id+'/suspend','POST',{reason:r.trim()})}
function uns(id){act('/admin/users/'+id+'/unsuspend','POST')}

const total=t=>t.price+t.items;
const left=t=>{const m=Math.max(0,43200000-(Date.now()-t.deliveredAt));return Math.floor(m/3600000)+'h '+Math.floor(m%3600000/60000)+'m'};
const wa=(p,m)=>'https://wa.me/'+String(p).replace(/\D/g,'')+'?text='+encodeURIComponent(m);
const logo='<a class="logo" href="#/"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i>CampusRunner</a>';
const ico={post:'<path d="M12 5v14M5 12h14"/>',earn:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 13h2"/>',admin:'<path d="M12 3l8 4v5c0 5-3.500 8-8 9-4.500-1-8-4-8-9V7z"/>'};
const tab=(h,l,k,p)=>`<a href="#/${h}" class="${p===h?'on':''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ico[k]}</svg>${l}</a>`;
function shell(p,body){const u=me();return `${bn()}<header><div class="w">${logo}${u?`<button class="btn o s" onclick="out()">Sign out</button>`:`<a class="btn o s" href="#/login?mode=login">Sign in</a>`}</div></header><main class="w">${body}</main>${u&&u.verified?`<nav class="tabs"><div class="w">${tab('post','Post','post',p)}${tab('earn','Earn','earn',p)}${tab('wallet','Wallet','wallet',p)}${u.role==='Admin'?tab('admin','Admin','admin',p):''}</div></nav>`:''}`}
function landing(){return `${bn()}<section class="hero"><div class="w"><div class="logo" style="color:#fff;margin-bottom:28px"><i style="background:#fff3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></i>CampusRunner</div><h1>Get it done on campus.</h1><p>Post a food run, a package pickup, an assignment or a project. A verified Nile University student picks it up and gets paid when it is done.</p><p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" style="background:#fff;color:var(--g);box-shadow:none" href="#/login?mode=register">Get started</a><a class="btn o" style="background:transparent;color:#fff;border-color:#fff" href="#/login?mode=login">Sign in</a></p></div></section>
<div class="w"><h2 style="margin:24px 0 8px">How it works</h2><div class="sp"><div class="step"><b>1</b><div><strong>Post a task</strong><div class="mut">Say what you need, where, and by when. Pay once.</div></div></div><div class="step"><b>2</b><div><strong>A student accepts</strong><div class="mut">Your money is held safely until the job is done.</div></div></div><div class="step"><b>3</b><div><strong>Share the pickup code</strong><div class="mut">Give the runner your 4-digit code when the order arrives. Payment releases at once.</div></div></div></div>
<h2 style="margin:24px 0 8px">Services and prices</h2><div class="card"><strong>Food and Packages</strong><div class="mut">Fixed ${N(FEE)} delivery fee, plus the cost of items (repaid to the runner in full).</div></div><div class="card"><strong>Assignment and Project</strong><div class="mut">You set the price, from ₦500.</div></div>
<h2 style="margin:24px 0 8px">Built for safety</h2><div class="card mut">Verified student IDs. Money held until the job is done. A pickup code only you can see. Disputes reviewed by an admin.</div>
<h2 style="margin:24px 0 8px">Earn as a runner</h2><div class="card mut">Keep 90% of the service price. Items are repaid in full. Withdraw from ₦1,000.</div>
<p style="text-align:center;margin:24px 0 40px"><a class="btn b" href="#/login?mode=register">Get started</a></p></div>`}
function login(q){const reg=q.get('mode')==='register';return `${bn()}<div style="background:linear-gradient(145deg,var(--gd),var(--g));padding:24px 0 70px"><div class="w"><div class="logo" style="color:#fff"><i style="background:#fff3"></i>CampusRunner</div><h1 style="color:#fff;margin-top:12px">${reg?'Create your account':'Welcome back'}</h1></div></div>
<div class="w" style="margin-top:-48px"><div class="card">${S.err||S.sus?`<div class="err">${e(S.err||S.sus)}</div>`:''}${reg?`<label>Full name<input id="n" autocomplete="name"></label><label>Student ID number<input id="sid"></label><label>Phone number<input id="ph" inputmode="tel" placeholder="08012345678"></label>`:''}<label>Email<input id="em" type="email" placeholder="you@example.com"></label><label>Password<input id="pw" type="password" placeholder="8 or more characters"></label>${reg?`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="cs" type="checkbox" style="width:22px;min-height:22px;margin:0">I agree to my student ID being checked. Photo upload is not part of this version.</label><br>`:''}<button class="btn b" onclick="${reg?'reg()':'inn()'}">${reg?'Create account':'Sign in'}</button><p class="mut" style="text-align:center">${reg?'Have an account? <a href="#/login?mode=login">Sign in</a>':'New here? <a href="#/login?mode=register">Create an account</a>'}</p></div>
${db.demo&&!reg?`<div class="card"><strong>Demo logins</strong> <span class="mut">(password demo1234)</span><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="btn o s" onclick="fill('ada@example.com')">Ada</button><button class="btn o s" onclick="fill('tunde@example.com')">Tunde</button><button class="btn o s" onclick="fill('admin@example.com')">Admin</button></div></div>`:''}</div>`}
function fill(m){document.getElementById('em').value=m;document.getElementById('pw').value='demo1234'}
const v=id=>(document.getElementById(id)||{}).value||'';
function pending(u){return shell('post',`<div class="card empty"><b>⏳</b><h2>Verification pending</h2><p>An admin is checking your student ID. This page rechecks every 15 seconds.</p>${u.rejected?`<div class="err">ID rejected: ${e(u.rejected)}</div><button class="btn b" onclick="resub()">Submit ID again</button><br><br>`:''}<button class="btn o b" onclick="go()">Check again</button></div>`)}
function post(u){const my=db.tasks.filter(t=>t.clientId===u.id).sort((a,b)=>b.id-a.id),f=S.f,gift=S.type==='Food'||S.type==='Delivery',open=S.show||!my.length;
const form=`<div class="card"><h3>New task</h3><div class="mut">What do you need?</div><br><div class="tiles">${Object.entries(SVC).map(([k,l])=>`<button class="tile ${S.type===k?'on':''}" onclick="setT('${k}')">${l}</button>`).join('')}</div><br>${S.err?`<div class="err">${e(S.err)}</div>`:''}
<label>Title<input id="ti" value="${e(f.ti)}" placeholder="What should the runner do?"></label><label>Details<textarea id="de">${e(f.de)}</textarea></label>
${gift?`<label>Pickup<input id="pk" value="${e(f.pk)}" placeholder="Cafeteria counter 2"></label><div class="chips">${LOCS.map(l=>`<button class="chip" onclick="loc('pk','${l}')">${l}</button>`).join('')}</div>`:''}
<label>Drop-off<input id="dr" value="${e(f.dr)}" placeholder="Boys Hostels, Block B, Room 12"></label><div class="chips">${LOCS.map(l=>`<button class="chip" onclick="loc('dr','${l}')">${l}</button>`).join('')}</div>
<label>When do you need it?</label><div class="chips">${WHEN.map(w=>`<button class="chip ${S.when===w?'on':''}" onclick="S.when='${w}';save2();go()">${w}</button>`).join('')}</div>
${gift?`<label>Cost of items (₦0 to ₦50,000)<input id="it" type="number" inputmode="numeric" value="${e(f.it||0)}" oninput="split()"></label>`:`<label>Your price (minimum ₦500)<input id="pr" type="number" inputmode="numeric" value="${e(f.pr||'')}" oninput="split()"></label>`}
<div class="mut" id="sp"></div><br><button class="btn b" id="pb" onclick="mk()">Post and pay</button></div>`;
return shell('post',`<h2 style="margin:20px 0 4px">Hi ${e(u.name.split(' ')[0])}</h2>${S.msg?`<div class="ok">${e(S.msg)}</div>`:''}${open?form:`<button class="btn b" onclick="S.show=true;go()">+ New task</button>`}<h3 style="margin-top:20px">Your tasks</h3>${my.length?my.map(t=>mine(t)).join(''):'<div class="empty"><b>📝</b>Your tasks will show here.</div>'}`)}
function save2(){['ti','de','pk','dr','it','pr'].forEach(k=>{const el=document.getElementById(k);if(el)S.f[k]=el.value})}
function setT(t){save2();S.type=t;S.err='';go()}
function loc(id,l){const el=document.getElementById(id);el.value=l+', ';el.focus()}
function priceOf(){const g=S.type==='Food'||S.type==='Delivery';return g?{p:FEE,i:+v('it')||0}:{p:+v('pr')||0,i:0}}
function split(){const {p,i}=priceOf(),el=document.getElementById('sp'),b=document.getElementById('pb');if(el)el.innerHTML=`Service ${N(p)}${i?` + items ${N(i)}`:''}. <b>You pay ${N(p+i)}</b>.`;if(b)b.textContent='Post and pay '+N(p+i)}
function mine(t){const r=t.runnerId&&usr(t.runnerId);let st=t.status==='Pending'?(t.funded?'Waiting for a runner':'Unpaid'):t.status==='Accepted'?(t.deliveredAt?'Runner says delivered':'In progress'):t.status,k=t.status;
let a='';if(t.status==='Pending'){a=(t.funded?'':`<button class="btn s" onclick="startPay(${t.id})">Pay ${N(total(t))} with Paystack</button> `)+`<button class="btn o s" onclick="cancel(${t.id})">${t.funded?'Cancel and refund':'Cancel task'}</button>`}
if(t.status==='Accepted'){a=`<div class="mut">Give this code to the runner only after your order arrives.</div><div class="code">${t.code}</div>`+(r?`<div class="mut">Runner: ${e(r.name)} ${e(r.phone)}</div>`:'')+(t.deliveredAt?`<div class="mut">Payment releases automatically in ${left(t)}.</div><button class="btn s" onclick="done(${t.id})">Mark complete</button> `:'')+`<button class="btn r s" onclick="report(${t.id})">Report a problem</button>`}
if(t.status==='Disputed')a='<div class="mut">An admin is reviewing this. Payment is paused.</div>';
return `<div class="card"><div class="row"><strong>${e(t.title)}</strong><span class="badge b-${k}">${st}</span></div><div class="mut">${t.pickup?e(t.pickup)+' → ':''}${e(t.drop)}<br>${N(total(t))} total</div><div style="margin-top:8px">${a}</div></div>`}
function earn(u){const act=db.tasks.filter(t=>t.runnerId===u.id&&(t.status==='Accepted'||t.status==='Disputed')),q=S.q.toLowerCase(),
feed=db.tasks.filter(t=>t.status==='Pending'&&t.funded&&t.clientId!==u.id&&(S.filter==='All'||t.type===S.filter||(S.filter==='Packages'&&t.type==='Delivery'))&&(!q||(t.title+t.pickup+t.drop).toLowerCase().includes(q)));
const F=[['All','All'],['Food','Food'],['Delivery','Packages'],['Assignment','Assignments'],['Project','Projects']];
return shell('earn',`<div class="card bal"><div class="mut" style="color:#d1fae5">Available to withdraw</div><div class="big">${N(u.bal)}</div><div class="row"><span>${act.length} active gig${act.length===1?'':'s'}</span><a class="btn s" style="background:#fff;color:var(--g);box-shadow:none" href="#/wallet">Withdraw</a></div></div>
${S.err?`<div class="err">${e(S.err)}</div>`:''}<h3>Your active gigs</h3>${act.length?act.map(gig).join(''):'<div class="empty"><b>🏃</b>Accept a task below to start earning.</div>'}
<h3 style="margin-top:20px">Open tasks</h3><input id="sq" placeholder="Search title, pickup or drop-off" value="${e(S.q)}" oninput="S.q=this.value;go('sq')"><div class="chips">${F.map(([k,l])=>`<button class="chip ${S.filter===k?'on':''}" onclick="S.filter='${k}';go()">${l}</button>`).join('')}</div>
${feed.length?feed.map(t=>`<div class="card"><div class="row"><strong>${e(t.title)}</strong><span class="badge">${SVC[t.type]}</span></div><div class="mut">${t.pickup?e(t.pickup)+' → ':''}${e(t.drop)}<br>Needed: ${e(t.when)}</div><div class="row" style="margin-top:8px"><div><strong>You get ${N(total(t)-Math.round(t.price*.1))}</strong>${t.items?`<div class="mut">includes ${N(t.items)} for items, repaid to you</div>`:''}</div><button class="btn s" onclick="acc(${t.id})">Accept</button></div></div>`).join(''):'<div class="empty"><b>🔍</b>No open tasks match. Check back soon.</div>'}`)}
function gig(t){const c=usr(t.clientId);return `<div class="card"><div class="row"><strong>${e(t.title)}</strong><span class="badge b-${t.status}">${t.status}</span></div><div class="mut">${t.pickup?e(t.pickup)+' → ':''}${e(t.drop)}</div>${t.status==='Accepted'?`<div class="row" style="margin:8px 0"><a class="btn o s" href="tel:${e(c.phone)}">Call</a><a class="btn o s" target="_blank" rel="noopener" href="${wa(c.phone,'Hi, I am your CampusRunner runner for: '+t.title)}">WhatsApp</a></div>
<label>Poster pickup code<input id="cd${t.id}" inputmode="numeric" maxlength="4" ${t.attempts>=5?'disabled':''}></label>${t.attempts>=5?'<div class="err">Code entry is locked. Use Mark as delivered.</div>':`<button class="btn b" onclick="code(${t.id})">Confirm code</button>`}<br><br>
${t.deliveredAt?`<div class="mut">Payment releases automatically in ${left(t)}.</div><a class="btn o s" target="_blank" rel="noopener" href="${wa(c.phone,'Hi, I delivered "'+t.title+'". Please mark it complete on CampusRunner.')}">Remind the poster on WhatsApp</a> `:`<button class="btn o s" onclick="dlv(${t.id})">Mark as delivered</button> `}<button class="btn r s" onclick="report(${t.id})">Report a problem</button>`:'<div class="mut">Payment is paused while an admin reviews.</div>'}</div>`}
function wallet(u){const h=db.tx.filter(x=>x.uid===u.id);return shell('wallet',`<div class="card bal"><div class="mut" style="color:#d1fae5">Available balance</div><div class="big">${N(u.bal)}</div><div>In escrow: ${N(u.esc)}</div></div>${S.err?`<div class="err">${e(S.err)}</div>`:''}${S.msg?`<div class="ok">${e(S.msg)}</div>`:''}
${u.bank?`<div class="card"><div class="mut">Bank: ${e(u.bank.name)} ${e(u.bank.no)}</div><label>Amount (minimum ₦1,000)<input id="wa" type="number" inputmode="numeric"></label><button class="btn b" onclick="wd()">Withdraw to bank</button></div>`:`<div class="card"><strong>Add a bank account</strong><label>Bank<select id="bk">${(S.banks||[]).map(b=>`<option value="${e(b.code)}">${e(b.name)}</option>`).join('')}</select></label><label>Account number<input id="an" inputmode="numeric" maxlength="10"></label><button class="btn b" onclick="bank()">Save bank account</button></div>`}
<h3>History</h3>${h.length?h.map(x=>`<div class="card row"><div><strong>${x.type}</strong><div class="mut">${new Date(x.at).toLocaleString()}</div></div><strong>${N(x.amt)}</strong></div>`).join(''):'<div class="empty"><b>💳</b>Your payments will show here.</div>'}`)}
function aset(k,x){S[k]=x;go()}
function admin(u){const AT=S.at||'ov',tabs=[['ov','Overview'],['id','IDs'],['di','Disputes'],['ta','Tasks'],['us','Users'],['lg','Log']];
const P=db.users.filter(x=>!x.verified&&!x.rejected&&x.role==='Student'),D=db.tasks.filter(t=>t.status==='Disputed'),esc=db.stats.esc,LG=db.log||[];
const nav=`<div class="chips" style="margin-top:16px">${tabs.map(([k,l])=>`<button class="chip ${AT===k?'on':''}" onclick="aset('at','${k}')">${l}${k==='id'&&P.length?' ('+P.length+')':''}${k==='di'&&D.length?' ('+D.length+')':''}</button>`).join('')}</div>`;let b='';
if(AT==='ov'){const row=(l,n,hot)=>`<div class="row" style="padding:6px 0"><span>${l}</span><b style="${hot?'color:#b91c1c':''}">${n}</b></div>`;
b=`<div class="card">${row('IDs waiting',P.length,P.length)}${row('Open disputes',D.length,D.length)}${row('Open tasks',db.tasks.filter(t=>t.status==='Pending'&&t.funded).length)}${row('In progress',db.tasks.filter(t=>t.status==='Accepted').length)}${row('Students',db.users.filter(x=>x.role==='Student').length)}${row('Money held in escrow',N(esc))}${row('Commission earned',N(me().bal))}</div><a class="btn o b" href="#/wallet">Open admin wallet</a>`}
if(AT==='id')b=P.length?P.map(x=>`<div class="card"><strong>${e(x.name)}</strong><div class="mut">${e(x.email)}<br>ID ${e(x.sid)}, ${e(x.phone)}</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="ver(${x.id},1)">Approve</button><button class="btn r s" onclick="ver(${x.id},0)">Reject</button></div></div>`).join(''):'<div class="empty"><b>✅</b>No IDs waiting.</div>';
if(AT==='di')b=D.length?D.map(t=>`<div class="card"><strong>${e(t.title)}</strong><div class="mut">${e(usr(t.dispute.by).name)} says: ${e(t.dispute.reason)}<br>Poster ${e(usr(t.clientId).phone)}, runner ${e(usr(t.runnerId).phone)}<br>${N(total(t))} held</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="res(${t.id},1)">Pay runner</button><button class="btn r s" onclick="res(${t.id},0)">Refund poster</button></div></div>`).join(''):'<div class="empty"><b>🤝</b>No open disputes.</div>';
if(AT==='ta'){const q=(S.aq||'').toLowerCase(),f=S.as||'All',T=db.tasks.filter(t=>(f==='All'||t.status===f)&&(!q||(t.title+t.pickup+t.drop).toLowerCase().includes(q)));
b=`<input id="aq" placeholder="Search tasks" value="${e(S.aq||'')}" oninput="S.aq=this.value;go('aq')"><select onchange="aset('as',this.value)">${['All','Pending','Accepted','Completed','Disputed','Cancelled'].map(s=>`<option ${f===s?'selected':''}>${s}</option>`).join('')}</select>`+(T.length?T.map(t=>`<div class="card"><div class="row"><strong>${e(t.title)}</strong><span class="badge b-${t.status}">${t.status}</span></div><div class="mut">Poster ${e(usr(t.clientId).name)}${t.runnerId?', runner '+e(usr(t.runnerId).name):''}<br>${N(total(t))} ${t.funded?'(paid)':'(unpaid)'}</div>${['Pending','Accepted','Disputed'].includes(t.status)?`<button class="btn r s" style="margin-top:8px" onclick="fc(${t.id})">Force cancel</button>`:''}</div>`).join(''):'<div class="empty"><b>📋</b>No tasks match.</div>')}
if(AT==='us'){const q=(S.uq||'').toLowerCase(),U=db.users.filter(x=>x.role==='Student'&&(!q||(x.name+x.email+x.sid).toLowerCase().includes(q)));
b=`<input id="uq" placeholder="Search name, email or student ID" value="${e(S.uq||'')}" oninput="S.uq=this.value;go('uq')">`+(U.length?U.map(x=>`<div class="card"><div class="row"><strong>${e(x.name)}</strong><span class="badge ${x.suspended?'b-Disputed':x.verified?'b-Completed':'b-Pending'}">${x.suspended?'Suspended':x.verified?'Verified':'Not verified'}</span></div><div class="mut">${e(x.email)}<br>ID ${e(x.sid)}, ${e(x.phone)}${x.suspended?'<br>Reason: '+e(x.suspended):''}</div><button class="btn ${x.suspended?'o':'r'} s" style="margin-top:8px" onclick="${x.suspended?'uns':'sus'}(${x.id})">${x.suspended?'Unsuspend':'Suspend'}</button></div>`).join(''):'<div class="empty"><b>👥</b>No students match.</div>')}
if(AT==='lg')b=LG.length?LG.map(l=>`<div class="card"><strong>${e(l.a)}</strong><div class="mut">${e(l.d)}<br>${e((usr(l.by)||{}).name)}, ${new Date(l.at).toLocaleString()}</div></div>`).join(''):'<div class="empty"><b>📜</b>Admin actions will show here.</div>';
return shell('admin',`<h2 style="margin:20px 0 0">Admin</h2>${nav}${b}`)}
function go(keep){const [p,qs]=(location.hash.slice(1)||'/').split('?'),q=new URLSearchParams(qs||''),u=me(),R=document.getElementById('root');
if(p==='/wallet'&&u&&!S.banks&&!S.bk){S.bk=1;api('/wallet/banks').then(r=>{S.banks=r.banks||[];go()})}
let h;if(p==='/'||p==='')h=landing();else if(p==='/login')h=login(q);else if(!u){location.hash='#/login?mode=login';return}
else if(!u.verified&&u.role!=='Admin')h=pending(u);else if(p==='/earn')h=earn(u);else if(p==='/wallet')h=wallet(u);else if(p==='/admin'&&u.role==='Admin')h=admin(u);else h=post(u);
R.innerHTML=h+(S.pay?payOv():'');if(!qs&&p==='/post'){split()}else if(p==='/post')split();if(keep){const el=document.getElementById(keep);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}}
addEventListener('hashchange',()=>{S.err='';S.msg='';go()});
setInterval(async()=>{if(TOK&&(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){await load();go()}},15000);
(async()=>{const ref=new URLSearchParams(location.search).get('reference');if(ref&&TOK){await api('/payments/verify/'+ref);S.msg='Payment received. Your task is waiting for a runner.';history.replaceState(null,'','/#/post')}await load();go()})();
</script></body></html>
